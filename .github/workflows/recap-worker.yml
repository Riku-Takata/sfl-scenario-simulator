name: SFL Recap Evidence & Article Worker

on:
  schedule:
    # JST 00:10 (試合当日24時すぎ) / 08:00。概要欄のタイムスタンプ追記を待つ。
    - cron: "10 15 * * *"
    - cron: "0 23 * * *"
    # Available videos continue through extraction, verification and writing.
    - cron: "12,42 * * * *"
  workflow_dispatch:
    inputs:
      section:
        description: "Optional section slug to resume"
        required: false
        type: string
      check_archives:
        description: "Recheck unavailable official descriptions (normally 00:10/08:00 JST)"
        type: boolean
        default: false
      chapter_cache:
        description: "Prepared official chapter cache from HomeServer (base64 JSON)"
        type: string
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: sfl-recap-data-writer
  cancel-in-progress: false

jobs:
  advance-recap-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Advance one durable recap section
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VIDEO_MODELS: ${{ vars.GEMINI_VIDEO_MODELS }}
          GEMINI_TEXT_MODELS: ${{ vars.GEMINI_TEXT_MODELS }}
          GEMINI_VIDEO_MAX_CALLS: "24"
          GEMINI_VIDEO_MAX_SECONDS: "25200"
          GEMINI_VIDEO_TIME_BUDGET_MIN: "20"
          RECAP_PUBLICATION_MODE: auto
          RECAP_WORKER_SECTION: ${{ inputs.section }}
          RECAP_CHECK_ARCHIVES: ${{ inputs.check_archives == true || github.event.schedule == '10 15 * * *' || github.event.schedule == '0 23 * * *' }}
          RECAP_CHAPTER_CACHE: ${{ inputs.chapter_cache }}
        run: |
          if [ -n "$RECAP_WORKER_SECTION" ]; then
            npm run recap-worker -- --section="$RECAP_WORKER_SECTION"
          else
            npm run recap-worker
          fi

      - name: Commit durable evidence, articles, and job state
        id: recap-state
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/recap-evidence.json src/data/recap-articles.json src/data/recap-jobs.json src/data/video-facts.json src/data/match-recaps.json src/data/recap-usage.json
          if git diff --cached --quiet; then
            echo "No recap state changed."
          else
            git commit -m "chore(recap): advance evidence-backed article jobs"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish updated article snapshot to both sites
        if: always() && steps.recap-state.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run auto-update.yml --ref main -f force=false
