name: SFL 2026 Auto Result Fetch & Scenario Update

on:
  schedule:
    # SFL 2026 放送当夜 (火・金 22:00 / 23:00 / 23:55 JST = UTC 13:00 / 14:00 / 14:55)
    - cron: "0 13,14 * * 2,5"
    - cron: "55 14 * * 2,5"
    # 放送深夜 (水・土 01:00 / 02:30 JST = UTC 火・金 16:00 / 17:30)
    - cron: "0 16 * * 2,5"
    - cron: "30 17 * * 2,5"
    # 翌日朝〜夕方フォローアップ & 毎日定期チェック (09:30 / 12:30 / 15:30 / 18:30 JST = UTC 00:30 / 03:30 / 06:30 / 09:30)
    - cron: "30 0,3,6,9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "差分がなくても強制的に再計算・シナリオ再生成を実行する"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  update-scenarios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run SFL 2026 & CPT Top 96 Pipeline (Zod Validated)
        env:
          STARTGG_API_TOKEN: ${{ secrets.STARTGG_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            npm run pipeline:force
          else
            npm run pipeline
          fi

      - name: Run Zod & Simulator Unit Tests
        run: npm test

      - name: Commit and Push updated JSON data (Triggers Vercel Re-deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): auto-update SFL 2026 match results and CPT scenarios"
            # 自宅サーバーの Buckler 集計 (src/data/buckler-*.json) の push と競合しないよう取り込んでから push
            git pull --rebase origin main
            git push
          fi
