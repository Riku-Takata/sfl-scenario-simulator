name: SFL 2026 Auto Result Fetch & Scenario Update

on:
  push:
    branches: [main]
  schedule:
    # 結果の速報更新とworker起動を15分ごとに確認する
    - cron: "7,22,37,52 * * * *"
    # SFL 2026 放送当夜 (火・金 22:00 / 23:00 / 23:55 JST = UTC 13:00 / 14:00 / 14:55)
    - cron: "0 13,14 * * 2,5"
    - cron: "55 14 * * 2,5"
    # 放送深夜 (水・土 01:00 / 02:30 JST = UTC 火・金 16:00 / 17:30)
    - cron: "0 16 * * 2,5"
    - cron: "30 17 * * 2,5"
    # 翌日朝〜夕方フォローアップ & 毎日定期チェック (09:30 / 12:30 / 15:30 / 18:30 JST = UTC 00:30 / 03:30 / 06:30 / 09:30)
    - cron: "30 0,3,6,9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "差分がなくても強制的に再計算・シナリオ再生成を実行する"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

# 定期実行と HomeServer からの手動起動が重なっても、同時に走らせず順番に処理する
concurrency:
  group: sfl-recap-data-writer
  cancel-in-progress: false

jobs:
  update-scenarios:
    runs-on: ubuntu-latest
    # 動画解析は20分で新規呼び出しを止めて持ち越すが、万一に備えてジョブ全体にも上限を設ける
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run SFL 2026 & CPT Top 96 Pipeline (Zod Validated)
        env:
          STARTGG_API_TOKEN: ${{ secrets.STARTGG_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The recap job input hash includes these. They must match recap-worker.yml,
          # or a results update treats every article as stale and deletes it.
          RECAP_PUBLICATION_MODE: auto
          GEMINI_VIDEO_MODELS: ${{ vars.GEMINI_VIDEO_MODELS }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            npm run pipeline:force -- --results-only
          else
            npm run pipeline -- --results-only
          fi

      - name: Run Zod & Simulator Unit Tests
        run: npm test

      - name: Commit and Push updated JSON data (Triggers Vercel Re-deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): auto-update SFL 2026 match results and CPT scenarios"
            # 自宅サーバーの Buckler 集計 (src/data/buckler-*.json) の push と競合しないよう取り込んでから push
            git pull --rebase origin main
            git push
          fi

      - name: Build canonical static site
        env:
          SITE_URL: https://sfl-simulator.vercel.app
        run: |
          npm run build

      - name: Package immutable Home Server release
        run: |
          mkdir -p release/runtime
          cp -R dist release/dist
          cp scripts/serve-static.mjs release/runtime/serve-static.mjs
          cp .github/workflows/release.Dockerfile release/runtime/Dockerfile
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('release')
          files = {}
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              files[path.relative_to(root).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          info = json.loads((root / 'dist/build-info.json').read_text())
          (root / 'release-manifest.json').write_text(json.dumps({
              'schemaVersion': 1,
              'service': 'sfl-scenario-simulator',
              'buildId': info['buildId'],
              'sourceCommit': info['sourceCommit'],
              'contentHash': info['contentHash'],
              'files': files,
          }, indent=2) + '\n')
          PY
          cd release && zip -qr ../sfl-site.zip .

      - name: Verify Vercel serves byte-identical build
        env:
          PRODUCTION_URL: https://sfl-simulator.vercel.app
        run: |
          python3 - <<'PY'
          import hashlib, json, time, urllib.error, urllib.request
          base = __import__('os').environ['PRODUCTION_URL'].rstrip('/')
          manifest = json.load(open('release/release-manifest.json', encoding='utf-8'))
          expected = manifest['buildId']
          deadline = time.monotonic() + 900
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(base + '/build-info.json', timeout=20) as response:
                      info = json.load(response)
                  if info.get('service') == manifest['service'] and info.get('buildId') == expected:
                      if info.get('contentHash') != manifest['contentHash']:
                          raise RuntimeError('Vercel build-info content hash differs from release manifest')
                      for relative, digest in manifest['files'].items():
                          if not relative.startswith('dist/'):
                              continue
                          url_path = relative[len('dist/'):]
                          request = urllib.request.Request(base + '/' + url_path, headers={'Accept-Encoding': 'identity'})
                          try:
                              with urllib.request.urlopen(request, timeout=30) as response:
                                  body = response.read()
                          except urllib.error.HTTPError as error:
                              if url_path != '404.html' or error.code != 404:
                                  raise
                              body = error.read()
                          actual = hashlib.sha256(body).hexdigest()
                          if actual != digest:
                              raise RuntimeError(f'Vercel file differs from canonical build: {url_path}')
                      print(f'Verified {expected}: every published dist file matches Vercel byte for byte')
                      break
              except urllib.error.URLError as error:
                  print(f'Waiting for Vercel deployment: {error}')
              time.sleep(15)
          else:
              raise RuntimeError(f'Vercel did not serve canonical build {expected} within 15 minutes')
          PY

      - name: Publish immutable site release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_id=$(node -e "console.log(JSON.parse(require('fs').readFileSync('public/build-info.json')).buildId)")
          tag="sfl-site-$build_id"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" sfl-site.zip --repo "$GITHUB_REPOSITORY" \
              --title "$tag" --notes "Canonical SFL static build for $GITHUB_SHA"
          gh release upload "$tag" sfl-site.zip --repo "$GITHUB_REPOSITORY" --clobber
